<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <linearGradient id="shrmGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4f46e5"/>
      <stop offset="100%" stop-color="#7c3aed"/>
    </linearGradient>
    <filter id="shrmShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="1" stdDeviation="1" flood-color="#000000" flood-opacity="0.12"/>
    </filter>
  </defs>

  <!-- Bright White / Light Squircle Base -->
  <rect x="2" y="2" width="60" height="60" rx="14" fill="#ffffff" filter="url(#shrmShadow)"/>
  <rect x="2" y="2" width="60" height="60" rx="14" fill="none" stroke="url(#shrmGrad)" stroke-width="2.5"/>

  <!-- Graduation Cap (Mortarboard) -->
  <path d="M 29 23 L 43 29.5 L 29 36 L 15 29.5 Z" fill="url(#shrmGrad)"/>
  <path d="M 21 33.5 L 21 41 C 21 45.5 37 45.5 37 41 L 37 33.5" fill="none" stroke="url(#shrmGrad)" stroke-width="2.5" stroke-linecap="round"/>
  <path d="M 43 29.5 L 43 40" stroke="#f59e0b" stroke-width="2" stroke-linecap="round"/>
  <circle cx="43" cy="42" r="2" fill="#f59e0b"/>

  <!-- Warm Golden Amber Accent Dot -->
  <circle cx="48" cy="18" r="3.5" fill="#f59e0b"/>
</svg>
