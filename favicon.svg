<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <!-- Royal Indigo to Purple Gradient -->
    <linearGradient id="shrmGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4f46e5"/>
      <stop offset="100%" stop-color="#7c3aed"/>
    </linearGradient>
    <filter id="shrmShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="1" stdDeviation="1" flood-color="#000000" flood-opacity="0.12"/>
    </filter>
  </defs>

  <!-- Bright White Squircle Base -->
  <rect x="2" y="2" width="60" height="60" rx="14" fill="#ffffff" filter="url(#shrmShadow)"/>
  <rect x="2" y="2" width="60" height="60" rx="14" fill="none" stroke="url(#shrmGrad)" stroke-width="2.5"/>

  <!-- Modern 3D Faceted Academic Cap & Tied Diploma (Centered, No Dot) -->
  <!-- Mortarboard Top Face (Upper Diamond) -->
  <polygon points="32,16 50,23.5 32,31 14,23.5" fill="url(#shrmGrad)"/>

  <!-- Mortarboard 3D Rim Under-edge -->
  <polygon points="14,23.5 14,25.5 32,33 50,25.5 50,23.5 32,31" fill="#3730a3"/>

  <!-- Cap Crown / Skullcap -->
  <path d="M 23 29.5 L 23 36 C 23 41.5 41 41.5 41 36 L 41 29.5" fill="none" stroke="url(#shrmGrad)" stroke-width="2.6" stroke-linecap="round"/>

  <!-- Golden Apex Button -->
  <circle cx="32" cy="23.5" r="2.2" fill="#f59e0b"/>

  <!-- Draped Golden Tassel -->
  <path d="M 32 23.5 C 38 23.5 43.5 26.5 46 30 L 46 38.5" fill="none" stroke="#f59e0b" stroke-width="2" stroke-linecap="round"/>
  <circle cx="46" cy="39" r="1.8" fill="#f59e0b"/>
  <!-- Tassel Brush/Fringe -->
  <path d="M 44.5 40.5 L 44 44.5 M 46 40.8 L 46 45 M 47.5 40.5 L 48 44.5" stroke="#f59e0b" stroke-width="1.3" stroke-linecap="round"/>

  <!-- Tied Diploma Scroll Underneath -->
  <rect x="20" y="44" width="24" height="4.5" rx="2.25" fill="#f8fafc" stroke="url(#shrmGrad)" stroke-width="1.8"/>
  <circle cx="22.25" cy="46.25" r="1" fill="url(#shrmGrad)"/>
  <!-- Gold Ribbon Tie & Ends -->
  <rect x="30" y="43" width="4" height="6.5" rx="1" fill="#f59e0b"/>
  <path d="M 31 49.5 L 29.5 52.5 M 33 49.5 L 34.5 52.5" stroke="#f59e0b" stroke-width="1.4" stroke-linecap="round"/>
</svg>
